name: Sync OuonnkiTV

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: OuonnkiTV
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/Ouonnki/OuonnkiTV.git
          git fetch --prune upstream

      - name: Hard reset OuonnkiTV to upstream/main
        run: |
          git checkout OuonnkiTV || git checkout -b OuonnkiTV
          git reset --hard upstream/main

      - name: Push (force) to OuonnkiTV
        run: |
          git push origin OuonnkiTV --force

name: CPA

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Pull upstream
        run: docker pull eceasy/cli-proxy-api:latest

      - name: Retag
        run: docker tag eceasy/cli-proxy-api:latest ghcr.io/${OWNER_LC}/cpa:latest

      - name: Push
        run: docker push ghcr.io/${OWNER_LC}/cpa:latest

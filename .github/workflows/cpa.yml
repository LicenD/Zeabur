name: CPA

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Pull upstream
        run: docker pull eceasy/cli-proxy-api:latest

      - name: Get upstream version
        id: get_version
        run: |
          VERSION=$(docker inspect eceasy/cli-proxy-api:latest \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')

          if [ -z "$VERSION" ]; then
            echo "No version label found, fallback to date"
            VERSION=$(date +%Y%m%d)
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Tag images
        run: |
          IMAGE=ghcr.io/${OWNER_LC}/cpa
          docker tag eceasy/cli-proxy-api:latest ${IMAGE}:${VERSION}
          docker tag eceasy/cli-proxy-api:latest ${IMAGE}:latest

      - name: Push version tag
        run: docker push ghcr.io/${OWNER_LC}/cpa:${VERSION}

      - name: Push latest tag
        run: docker push ghcr.io/${OWNER_LC}/cpa:latest

name: CPA

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Pull upstream latest
        run: docker pull eceasy/cli-proxy-api:latest

      - name: Detect version tag by matching digest (DockerHub API)
        run: |
          set -euo pipefail

          REPO="eceasy/cli-proxy-api"
          HUB="https://hub.docker.com/v2/repositories/${REPO}/tags"

          # 取 latest 的所有平台 digest（multi-arch 会有多个）
          LATEST_JSON=$(curl -fsSL "${HUB}/latest")
          LATEST_DIGESTS=$(echo "$LATEST_JSON" | jq -r '.images[].digest' | sort -u)

          echo "Latest digests:"
          echo "$LATEST_DIGESTS"

          # 遍历 tag 列表，找一个名字像 v* 且 digest 集合与 latest 完全一致的 tag
          URL="${HUB}?page_size=100"
          FOUND=""

          while [ -n "$URL" ] && [ "$URL" != "null" ]; do
            PAGE=$(curl -fsSL "$URL")
            # 候选 tag：以 v 开头（你也可以按需改成更严格的正则）
            TAGS=$(echo "$PAGE" | jq -r '.results[].name' | grep -E '^v' || true)

            for T in $TAGS; do
              TJ=$(curl -fsSL "${HUB}/${T}")
              D=$(echo "$TJ" | jq -r '.images[].digest' | sort -u)

              if [ "$D" = "$LATEST_DIGESTS" ]; then
                FOUND="$T"
                break
              fi
            done

            if [ -n "$FOUND" ]; then
              break
            fi

            URL=$(echo "$PAGE" | jq -r '.next')
          done

          if [ -z "$FOUND" ]; then
            echo "No matching version tag found for latest digest, fallback to date"
            FOUND=$(date +%Y%m%d)
          fi

          echo "VERSION_TAG=$FOUND" >> $GITHUB_ENV
          echo "Detected version tag: $FOUND"

      - name: Tag images (version + latest)
        run: |
          IMAGE=ghcr.io/${OWNER_LC}/cpa
          docker tag eceasy/cli-proxy-api:latest ${IMAGE}:${VERSION_TAG}
          docker tag eceasy/cli-proxy-api:latest ${IMAGE}:latest

      - name: Push version tag
        run: docker push ghcr.io/${OWNER_LC}/cpa:${VERSION_TAG}

      - name: Push latest tag
        run: docker push ghcr.io/${OWNER_LC}/cpa:latest

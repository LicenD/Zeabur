name: Unique-PPT

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REMOTE_REPO: uniqueww/unique-ppt
  REMOTE_REF: main
  IMAGE_NAME: unique-ppt  # 你想要的镜像名（会自动转小写）

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remote repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REMOTE_REPO }}
          ref: ${{ env.REMOTE_REF }}
          path: src

      - name: Generate Dockerfile (temporary)
        working-directory: src
        run: |
          cat > Dockerfile <<'EOF'
          FROM node:18-alpine AS builder
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci
          COPY . .
          RUN npm run build

          FROM nginx:stable-alpine
          COPY --from=builder /app/dist /usr/share/nginx/html
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image ref (lowercase owner + name)
        id: img
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          NAME_LC="$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${OWNER_LC}/${NAME_LC}" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: src
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

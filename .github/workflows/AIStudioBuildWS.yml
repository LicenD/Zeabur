name: AIStudioBuildWS

on:
  schedule:
    - cron: "0 23 * * *"   
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Checkout upstream repo
        uses: actions/checkout@v4
        with:
          repository: hkfires/AIStudioBuildWS
          ref: main
          path: upstream

      - name: Get short commit SHA
        run: |
          cd upstream
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=${SHORT_SHA}" >> $GITHUB_ENV
          echo "Detected commit: ${SHORT_SHA}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          IMAGE=ghcr.io/${OWNER_LC}/aistudiobuildws
          docker build -t ${IMAGE}:${VERSION} -t ${IMAGE}:latest ./upstream

      - name: Push version tag
        run: docker push ghcr.io/${OWNER_LC}/aistudiobuildws:${VERSION}

      - name: Push latest tag
        run: docker push ghcr.io/${OWNER_LC}/aistudiobuildws:latest
